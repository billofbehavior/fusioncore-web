<header class="topnav">
  <div class="topnav__inner">
    <a class="topnav__brand" href="{{ "/" | relURL }}">
      {{ $mark := .Params.brand_mark | default "fusioncore" }}
      <img class="topnav__logomark"
           src="{{ (printf "brand/%s/icon-192.png" $mark) | relURL }}"
           alt="{{ .Params.brand_full | default "fusioncore.ai" }}">
      <span class="topnav__brand-text">{{ .Params.brand_full | default "fusioncore.ai" }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="topnav__toggle" aria-hidden="true">
    <label for="nav-toggle" class="topnav__burger" aria-label="Toggle menu" aria-controls="nav-menu">
      <span></span><span></span><span></span>
    </label>
    <nav class="topnav__menu" id="nav-menu" aria-label="Primary">
      <a href="https://fusioncore.ai" rel="external">fusioncore.ai</a>
      <a href="{{ "/bob/" | relURL }}">Bill of Behavior</a>
      <a href="{{ "/stormcenter/" | relURL }}">Storm Center</a>
      <a href="{{ "/blog/" | relURL }}">Blog</a>
      <a href="{{ "/reel/" | relURL }}">Reel</a>
      <a href="{{ "/free-materials/" | relURL }}">Free Materials</a>
      <a href="https://fusioncore.ai" rel="external">Contact</a>
    </nav>
  </div>
</header>
