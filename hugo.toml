baseURL = "https://billofbehavior.com/"
languageCode = "en-us"
title = "Bill of Behavior"

# Taxonomies still off (no tag/category indexes).
# RSS + sitemap are now ON — site has grown beyond a single page.
disableKinds = ["taxonomy", "term"]

[params]
  brand_short  = "BoB"
  brand_full   = "Bill of Behavior"
  parent_name  = "fusioncore.ai"
  parent_url   = "https://fusioncore.ai"

  hero_kicker  = "An open standard, in development"
  hero_title   = "Software Bill of Behavior"
  hero_lede    = "The runtime companion to the Software Bill of Materials. Vendor-neutral, machine-checkable, designed for EU Cyber Resilience Act and NIS 2 readiness."

  description  = "Software Bill of Behavior (SBOB): an open standard for declaring, verifying and auditing the runtime behavior of software."
  email        = "info@fusioncore.ai"
  location     = "Austria"

  github_org_bob   = "https://github.com/billofbehavior"
  github_org_sbob  = "https://github.com/softwarebillofbehavior"
  github_research  = "https://github.com/k8sstormcenter"
  # SBOB sources. k8sstormcenter/bob is canonical (billofbehavior/bob is a fork).
  bob_repo          = "https://github.com/k8sstormcenter/bob"
  bobctl            = "https://github.com/k8sstormcenter/bob/releases"
  sbob_spec         = "https://github.com/k8sstormcenter/sbob-spec"
  sbob_spec_full    = "https://github.com/k8sstormcenter/sbob-spec/blob/main/spec/sbob-v0.3.1.md"
  sbob_spec_version = "0.3.1"
  sbob_go           = "https://github.com/k8sstormcenter/sbob-go"
  kubescape_bob     = "https://kubescape.io/docs/operator/bill-of-behavior/"
  slack_join        = "https://slack.cncf.io"
  slack_channel     = "#sbob-bill-of-behavior"

[markup.goldmark.renderer]
  unsafe = true
